import java.nio.file.Files
import org.gradle.plugins.ide.eclipse.model.Output
import org.gradle.plugins.ide.eclipse.model.SourceFolder

plugins {
    id 'eclipse'
    id 'java'
    id 'maven-publish'

    id 'com.diffplug.spotless' version '8.4.0'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
    id 'net.ltgt.errorprone' version '5.1.0'
    // To show task list as a tree, run: ./gradlew <taskname> taskTree
    id 'com.dorongold.task-tree' version '4.0.1'
}

// Nexus Publish plugin requires a group/version at the root project.
group = 'org.jspecify.reference'
version = '0.0.0-SNAPSHOT'

sourceSets {
    main {
        resources {
            // Minimized jspecify/jdk
            srcDirs += [
                "${buildDir}/generated/resources"
            ]
        }
    }
}

repositories {
    mavenLocal()
    maven {
        name = 'Central Portal Snapshots'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
        content {
            includeGroup('org.jspecify.conformance')
        }
    }
    mavenCentral()
}

nexusPublishing {
    repositories {
        // see https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/#configuration
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
        }
    }
}

ext {
    // null if not included with `--include-build path/to/checker-framework`
    checkerFramework = gradle.includedBuilds.find { it.name == 'checker-framework' }

    // null if not included with `--include-build path/to/jspecify`
    jspecify = gradle.includedBuilds.find { it.name == 'jspecify' }

    // Location of the jspecify/jdk clone, relative to this directory by default. Overridable
    // (-PjspecifyJdkHome=/abs/path) so a caller building this alongside checker-framework's own
    // build -- which needs its own, different annotated JDK at the same conventional sibling
    // location -- can point this at a separate clone instead. See checker-framework's
    // checker/bin-devel/test-jspecify-reference-checker.sh for a caller that uses this.
    jspecifyJdkHome = project.findProperty('jspecifyJdkHome') ?: '../jdk'

    errorproneSupportsCurrentJdk = Integer.valueOf(JavaVersion.current().getMajorVersion()) >= 21

    javacModules = [
        "api",
        "code",
        "comp",
        "file",
        "main",
        "model",
        "parser",
        "processing",
        "resources",
        "tree",
        "util",
    ]
    javacExports = javacModules.collect { "--add-exports=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED".toString() }
    javacOpens = javacModules.collect { "--add-opens=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED".toString() }
}

configurations {
    errorproneJavac
    conformanceTestSuite {
        // When including a local JSpecify build, depend on the local test suite.
        // See https://docs.gradle.org/current/userguide/cross_project_publications.html#sec:variant-aware-sharing.
        if (jspecify != null) {
            attributes {
                attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, 'conformance-tests'))
            }
        }
    }
}

java {
    sourceCompatibility = 1.9
}

dependencies {
    implementation libs.checkerFramework.checker
    implementation libs.checkerFramework.checker.qual
    // Eventually, we would want to only depend on `framework` and
    // `javacutil` artifacts instead of the entire `checker`.
    // implementation libs.checkerFramework.framework
    // implementation libs.checkerFramework.javacutil

    implementation libs.jspecify

    testImplementation libs.checkerFramework.framework.test
    testImplementation libs.guava
    testImplementation libs.junit
    testImplementation project(':conformance-test-framework')
    testRuntimeOnly libs.jsr305 // jsr305 annotations are in some of the samples

    conformanceTestSuite libs.jspecify.conformanceTests

    if (errorproneSupportsCurrentJdk) {
        errorproneJavac libs.errorProne.javac
        errorprone libs.errorProne.core
    }
}

configurations {
    checkerFrameworkRuntimeClasspath {
        canBeResolved = true
        canBeConsumed = false
        extendsFrom implementation
    }

    // BinaryStubDiffChecker, for the binaryStubDiffTest task below. It is in checker-framework's
    // framework-test artifact, which is not otherwise needed on this project's own classpaths.
    binaryStubDiffChecker {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    binaryStubDiffChecker libs.checkerFramework.framework.test
}

// If built with `--include-build path/to/checker-framework` then
// assemble checker-framework when assembling the reference checker.
if (checkerFramework != null) {
    compileJava.dependsOn(checkerFramework.task(":checker:assembleForJavac"))
}

// If built with `--include-build path/to/jspecify` then
// assemble jspecify when assembling the reference checker.
if (jspecify != null) {
    assemble.dependsOn(jspecify.task(':assemble'))
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-Xlint:all")
    // ErrorProne makes suppressing these easier
    options.compilerArgs.add("-Xlint:-fallthrough")

    options.errorprone.enabled = errorproneSupportsCurrentJdk
    options.errorprone.disable("BadImport")
    options.errorprone.disable("VoidUsed")

    options.compilerArgs.addAll(javacExports)
}

tasks.register('copyJSpecifyJDK', Copy) {
    def srcDir = "${jspecifyJdkHome}/src"
    // The annotated JDK is laid out as an "annotated-jdk" directory containing "src", and
    // "annotated-jdk" needs to be stored at the top level of the resulting .jar file.
    // org.checkerframework.framework.stub.AnnotationFileElementTypes will then load
    // the JDK classes from here instead of from checker.jar.
    //
    // It loads them from the binary stub file that includeJSpecifyJDK generates, rather than by
    // parsing the sources under "src". That file belongs at the root of the annotated JDK, as
    // "annotated-jdk/annotated-jdk.bin.gz" -- a sibling of "src", the layout checker.jar itself
    // uses, and where AnnotationFileElementTypes looks for it. It is not part of the JDK sources,
    // so it does not belong under "src"; see includeJSpecifyJDK, which writes it.
    def dstDir = "${buildDir}/generated/resources/annotated-jdk/src/"

    inputs.dir file(srcDir)
    outputs.dir file(dstDir)

    FileTree srcTree = fileTree(dir: srcDir)
    NavigableSet<String> specFiles = new TreeSet<>();
    srcTree.visit { FileVisitDetails fvd ->
        if (!fvd.file.isDirectory() && fvd.file.name.matches('.*\\.java')) {
            fvd.getFile().readLines().any { line ->
                if (line.contains('org.jspecify')) {
                    specFiles.add(fvd.file.absolutePath)
                    return true;
                }
            }
        }
    }
    String absoluteSrcDir = file(srcDir).absolutePath
    // +1 to strip the leading file separator from the relative path,
    // so Gradle's include pattern matching works correctly.
    int srcPrefixSize = absoluteSrcDir.size() + 1

    from(srcDir)
    into(dstDir)
    for (String specFile : specFiles) {
        include specFile.substring(srcPrefixSize)
    }
}

tasks.register('includeJSpecifyJDK', JavaExec)  {
    group = 'Build'

    if (checkerFramework != null) {
        dependsOn(checkerFramework.task(":checker:assembleForJavac"))
    }
    dependsOn 'copyJSpecifyJDK'

    // Give JavaStubifier the root of the annotated JDK, not the "src" directory below it that
    // copyJSpecifyJDK fills in: JavaStubifier minimizes every .java file under the directory it is
    // given (so the JDK sources under "src" are still minimized), and writes the binary stub file
    // into that same directory, which is where it belongs.
    // See comment in copyJSpecifyJDK.
    def jdkRootDir = "${buildDir}/generated/resources/annotated-jdk"

    inputs.dir file(jdkRootDir)
    outputs.dir file(jdkRootDir)

    // We only need the CF on the classpath.
    classpath = configurations.checkerFrameworkRuntimeClasspath

    standardOutput = System.out
    errorOutput = System.err

    mainClass = 'org.checkerframework.framework.stubifier.JavaStubifier'
    args jdkRootDir
}

processResources.dependsOn(includeJSpecifyJDK)

// Checks that reading this project's annotated JDK from its binary stub file produces exactly the
// annotations that parsing the JDK sources produces. The Checker Framework generates the binary
// stub file at build time (see includeJSpecifyJDK) and reads it in preference to the sources, so a
// disagreement between the two would silently change what the checker sees.
//
// The check runs while the checker initializes, over every class in the binary stub file, so what
// is compiled here does not matter; TriggerBinaryStubDiff.java exists only to make the checker run.
// BinaryStubDiffChecker implements it and ships in checker-framework's framework-test artifact.
tasks.register('binaryStubDiffTest', JavaCompile) {
    description = 'Check that the annotated JDK\'s binary stub file agrees with its sources.'
    group = 'verification'
    dependsOn 'jar'

    source = files("${projectDir}/tests/binary-stub-diff/TriggerBinaryStubDiff.java")
    destinationDirectory = layout.buildDirectory.dir('binaryStubDiff')

    // The checker's own qualifiers (com.google.jspecify.nullness.*) must be on the compilation
    // classpath, not merely the annotation-processor path: AnnotationBuilder resolves them through
    // Elements.getTypeElement, which reads the compilation classpath.
    classpath = files(tasks.jar.archiveFile) + configurations.runtimeClasspath

    // The checker itself, its annotated JDK (in the jar built above), and BinaryStubDiffChecker.
    options.annotationProcessorPath =
            files(tasks.jar.archiveFile) +
            configurations.runtimeClasspath +
            configurations.binaryStubDiffChecker

    // The Error Prone plugin decorates every JavaCompile task; this one runs only the checker.
    options.errorprone.enabled = false

    // Compile against the running JDK, not this project's sourceCompatibility. The check compares
    // what the binary stub file and the JDK sources say about JDK elements, and the text parser
    // resolves those elements against the compilation's JDK: under an older --release, an element
    // that JDK does not have resolves to nothing, and its annotations look like they are "only in
    // binary" when in truth neither side was ever asked about them.
    sourceCompatibility = JavaVersion.current().majorVersion
    targetCompatibility = JavaVersion.current().majorVersion

    options.compilerArgs += [
        '-processor',
        'com.google.jspecify.nullness.NullSpecChecker',
        '-AbinaryStubDiffCheck',
        '-proc:only',
    ]
    options.fork = true
    options.forkOptions.jvmArgs += javacExports
}


tasks.withType(Test).configureEach {
    if (!JavaVersion.current().java9Compatible) {
        jvmArgs "-Xbootclasspath/p:${configurations.errorproneJavac.asPath}"
    }

    // Required because checker-framework uses APIs from these modules.
    jvmArgs(javacOpens)

    testLogging {
        showStackTraces = false
        showStandardStreams = true
        events "failed"
        exceptionFormat = "full"
    }
}

test {
    include '**/NullSpecTest$Minimal.class'
    inputs.files("${rootDir}/tests/minimal")

    include '**/NullSpecTest$Regression.class'
    inputs.files("${rootDir}/tests/regression")
}

tasks.register('jspecifySamplesTest', Test) {
    description = 'Run the checker against the JSpecify samples.'
    group = 'verification'
    shouldRunAfter test
    outputs.upToDateWhen { false }
    include '**/NullSpecTest$Lenient.class'
    include '**/NullSpecTest$Strict.class'
    dependsOn 'unzipConformanceTestSuite'

    testClassesDirs = files('build/classes/java/test')
    classpath = sourceSets.test.runtimeClasspath

    def conformanceTests = layout.buildDirectory.dir("conformanceTests").get()
    inputs.dir(conformanceTests)
}

tasks.register('unzipConformanceTestSuite', Copy) {
    dependsOn configurations.conformanceTestSuite
    from zipTree(configurations.conformanceTestSuite.singleFile)
    into layout.buildDirectory.dir("conformanceTests")
}

tasks.register('conformanceTests', Test) {
    group = 'verification'
    include '**/ConformanceTest.class'
    dependsOn 'unzipConformanceTestSuite'

    shouldRunAfter test
    outputs.upToDateWhen { false }

    testClassesDirs = files('build/classes/java/test')
    classpath = sourceSets.test.runtimeClasspath

    def conformanceTests = layout.buildDirectory.dir("conformanceTests").get()

    // Conformance tests
    inputs.dir(conformanceTests)
    inputs.files("tests/ConformanceTest-report.txt")
    doFirst {
        def depsDir = new File("${conformanceTests}/deps")
        def depsList = []
        if (depsDir.exists()) {
            depsDir.eachFileRecurse { f ->
                if (f.isFile()) depsList << f.absolutePath
            }
            depsList.sort()
        }
        systemProperties([
            "JSpecifyConformanceTest.inputs": "${conformanceTests}/assertions/org/jspecify/conformance/tests",
            "JSpecifyConformanceTest.report": "tests/ConformanceTest-report.txt",
            "JSpecifyConformanceTest.deps"  : depsList.join(":")
        ])
    }

    // Conformance tests run on the samples directory
    inputs.files("tests/ConformanceTestOnSamples-report.txt")
    doFirst {
        systemProperties([
            "JSpecifyConformanceTest.samples.inputs": "${conformanceTests}/samples",
            "JSpecifyConformanceTest.samples.report": "tests/ConformanceTestOnSamples-report.txt"
        ])
    }
}

tasks.named('check').configure {
    dependsOn('conformanceTests')
}

tasks.register('deleteTestsBuild') {
    delete "${rootDir}/tests/build/"
}
clean.dependsOn('deleteTestsBuild')

tasks.register('demoTest', Exec)  {
    group = 'verification'
    shouldRunAfter 'conformanceTests'
    dependsOn assemble
    inputs.files('demo', 'SimpleSample.java')
    executable '/bin/sh'
    args 'demo', 'SimpleSample.java'
    ignoreExitValue = true
    def outputFile = layout.buildDirectory.file('demoTest-output.txt')
    outputs.file(outputFile)
    doFirst {
        errorOutput = Files.newOutputStream(outputFile.get().asFile.toPath())
    }
    doLast {
        def outputFileText = outputFile.get().asFile.text
        if (!outputFileText.contains("SimpleSample.java:7: error:")) {
            throw new AssertionError("`./demo SimpleSample.java` did not contain the expected error. Error output:\n${outputFileText}")
        }
    }
}

/*
 Spotless validates its formatters' dependencies eagerly, on project configuration.
 google-java-format depends on checker-qual, which is built by a subproject.
 On a clean build, the checker-qual JAR file doesn't exist yet, so Spotless throws an error.
 The file doesn't have to be correct; it just has to be a JAR file.
 So here, before the spotless block, we create a meaningless JAR file at that location if it doesn't already exist.
 See https://github.com/jspecify/jspecify-reference-checker/issues/81
 */
/* This work-around isn't compatible with the configuration cache.
 We don't need it, b/c we depend on EISOP CF and Spotless depends on typetools CF.
 */
/*
 if (checkerFramework != null) {
 def cfQualJar =
 checkerFramework.projectDir.toPath()
 .resolve("checker-qual/build/libs/checker-qual-${libs.versions.checkerFramework.get()}.jar")
 def injected = project.objects.newInstance(InjectedExecOps)
 if (!cfQualJar.toFile().exists()) {
 mkdir(cfQualJar.parent)
 injected.execOps.exec {
 executable 'jar'
 args = [
 'cf',
 cfQualJar,
 buildFile.path // Use this build script file!
 ]
 }
 }
 }
 */

spotless {
    java {
        target '**/*.java'
        googleJavaFormat()
        formatAnnotations()
    }
    groovyGradle {
        target '**/*.gradle'
        greclipse()
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
    }
}

// Use `./gradlew eclipseClasspath` to create Eclipse/VSCode configurations
eclipse.classpath {
    defaultOutputDir = file("build/default")
    file.whenMerged { cp ->
        cp.entries.forEach { cpe ->
            if (cpe instanceof SourceFolder) {
                cpe.output = cpe.output.replace "bin/", "build/classes/java/"
            }
            if (cpe instanceof Output) {
                cpe.path = cpe.path.replace "bin/", "build/"
            }
        }
    }
}

publishing {
    publications {
        jspecifyReferenceChecker(MavenPublication) {
            pom {
                groupId = 'org.jspecify.reference'
                artifactId = 'checker'
                version = project.version
                name = 'JSpecify Reference Checker'
                description = 'The JSpecify Reference Checker'
                url = 'http://jspecify.org/'
                from components.java
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                scm {
                    connection = 'scm:git:git@github.com:jspecify/jspecify-reference-checker.git'
                    developerConnection = 'scm:git:git@github.com:jspecify/jspecify-reference-checker.git'
                    url = 'https://github.com/jspecify/jspecify-reference-checker'
                }
                developers {
                    developer {
                        id = 'cpovirk'
                        name = 'Chris Povirk'
                        email = 'cpovirk@google.com'
                    }
                    developer {
                        id = 'netdpb'
                        name = 'David P. Baker'
                        email = 'dpb@google.com'
                    }
                    developer {
                        id = 'wmdietl'
                        name = 'Werner M. Dietl'
                        email = 'wdietl@gmail.com'
                    }
                }
            }
        }
    }
}
